<!doctype html>
<!-- Plugin icon source. Render: assets/src/render.sh (512×512 PNG → assets/icon.png). -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
</head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0B1B3F" flood-opacity="0.35"/>
    </filter>
    <!-- One shipping-container block: body plus vertical ribs. -->
    <g id="crate">
      <rect x="0" y="0" width="168" height="104" rx="16" fill="url(#box)"/>
      <g stroke="#1D4ED8" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round">
        <line x1="40" y1="26" x2="40" y2="78"/>
        <line x1="72" y1="26" x2="72" y2="78"/>
        <line x1="104" y1="26" x2="104" y2="78"/>
        <line x1="136" y1="26" x2="136" y2="78"/>
      </g>
    </g>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <use href="#crate" x="76" y="284"/>
    <use href="#crate" x="268" y="284"/>
    <use href="#crate" x="172" y="164"/>
  </g>
  <!-- Small link mark: the same panel reaches remote hosts. -->
  <g transform="translate(372 96)">
    <circle cx="0" cy="0" r="46" fill="#22D3EE"/>
    <g transform="rotate(-45)" fill="none" stroke="#0B3B66" stroke-width="8">
      <rect x="-34" y="-11" width="40" height="22" rx="11"/>
      <rect x="-6" y="-11" width="40" height="22" rx="11"/>
    </g>
  </g>
</svg>
</body>
</html>
