<!doctype html>
<!-- Plugin page cover (1600×1000). Panel PNGs: assets/src/shots/. Render: assets/src/render.sh -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1600px; height: 1000px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0F766E 0%, #1D4ED8 100%);
    color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    position: relative;
  }
  .glow { position: absolute; inset: 0; background: radial-gradient(900px 600px at 80% 40%, rgba(255,255,255,0.18), transparent 70%); }
  .text { position: absolute; left: 100px; top: 150px; width: 640px; }
  .text img { width: 132px; height: 132px; filter: drop-shadow(0 18px 30px rgba(8, 20, 60, 0.45)); }
  h1 { font-size: 92px; letter-spacing: -0.03em; margin: 36px 0 18px; }
  p { font-size: 32px; line-height: 1.4; margin: 0; color: rgba(255,255,255,0.88); }
  .note { position: absolute; left: 100px; bottom: 70px; font-size: 18px; color: rgba(255,255,255,0.7); }
  .shot { position: absolute; border-radius: 16px; overflow: hidden; box-shadow: 0 40px 80px rgba(5, 15, 45, 0.5); border: 1px solid rgba(255,255,255,0.18); }
  .shot img { display: block; zoom: 1.25; }
  .back { right: 320px; top: 150px; transform: rotate(-3deg); }
  .front { right: 80px; top: 130px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="text">
  <img src="../icon.png" alt="">
  <h1>Containers</h1>
  <p>See and manage containers on this Mac and on your Linux or macOS SSH hosts, from Orca's sidebar.</p>
</div>
<div class="shot back"><img src="shots/resources-light.png" alt=""></div>
<div class="shot front"><img src="shots/ssh-dark.png" alt=""></div>
<div class="note">Works with the Docker CLI. Not affiliated with Docker, Inc.</div>
</body>
</html>
